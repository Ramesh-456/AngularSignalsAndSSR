<div class="ml-4 flex-auto w-9">
            @if(this.selectedUserAlbumData.isLoading()){
            <h1>Loading...</h1>
            } @else if(this.selectedUserAlbumData.error()){
            <h1>Error...</h1>
            } @else if(this.selectedUserAlbumData.value()){
            <div class="card">
                <p-carousel [circular]="true" [value]="this.selectedUserAlbumData.value() || []" [numVisible]="3"
                    [numScroll]="1" [responsiveOptions]="responsiveOptions">
                    <ng-template let-photos #item>
                        <div class="border border-surface-200 dark:border-surface-700 rounded m-2 p-4">
                            <div class="mb-4">
                                <div class="relative mx-auto">
                                    <img alt="" src="https://picsum.photos/200/300?2random={{photos.id}}"
                                        [alt]="photos.title" height="200" width="300" class=" rounded-border" />
                                    <p-tag [value]="getSeverity(photos.title)" [severity]="getSeverity(photos.title)"
                                        class="absolute dark:!bg-surface-900"
                                        [ngStyle]="{ 'left.px': 5, 'top.px': 5 }" />
                                </div>
                            </div>
                            <div class="mb-4 font-medium">{{ photos.id }} {{ photos.title }}</div>
                            <div class="flex justify-between items-center">
                                <div class="mt-0 font-semibold text-xl">{{ '$' + photos.title }}</div>
                                <span>
                                    <p-button icon="pi pi-heart" severity="secondary" [outlined]="true" />
                                    <p-button icon="pi pi-shopping-cart" styleClass="ml-2" />
                                </span>
                            </div>
                        </div>
                    </ng-template>
                </p-carousel>
            </div>
            }
        </div>
